<p style="margin: 0 0 50px; color: #5E574E; max-width: 680px">Tout ce qui encadre les séances, la location de matériel et vos données, écrit simplement.</p>

<section id="regles" style="border-top: 1px solid #E3D9CA; padding-top: 30px; margin-bottom: 50px">
<h2 style="margin: 0 0 18px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1.1">Les règles en France</h2>
<p style="margin: 0 0 22px; color: #3E3832">Le cupping se pratique en France dans un cadre précis. Voici comment je le respecte, séance après séance.</p>
<div style="margin-bottom: 18px"><h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Du bien-être, pas un soin médical</h3><p style="margin: 0; color: #3E3832">Monsieur Cupping propose des prestations de bien-être et de détente. Je ne pose aucun diagnostic, je ne prescris rien et je ne promets aucune guérison. Une séance ne remplace jamais l’avis ni le suivi d’un médecin ou d’un kinésithérapeute.</p></div>
<div style="margin-bottom: 18px"><h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Ventouses sèches uniquement</h3><p style="margin: 0; color: #3E3832">Aucune incision, aucune piqûre, aucune saignée. La hijama dite « humide », qui consiste à inciser la peau, est en France un acte réservé aux médecins : je ne la pratique pas et je ne l’orienterai jamais vers quelqu’un qui n’est pas médecin.</p></div>
<div style="margin-bottom: 18px"><h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Votre santé d’abord</h3><p style="margin: 0; color: #3E3832">Avant la séance, je vous pose quelques questions. En cas de problème de santé, de traitement anticoagulant, de trouble de la coagulation, de problème cardiaque, de fièvre, de plaie ou de maladie de peau sur la zone, demandez l’avis de votre médecin. En cas de doute, la séance est reportée ou adaptée.</p></div>
<div style="margin-bottom: 18px"><h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Hygiène</h3><p style="margin: 0; color: #3E3832">Gants à usage unique, deux grandes serviettes propres préparées par le client, ventouses nettoyées et désinfectées après chaque séance.</p></div>
<div style="margin-bottom: 18px"><h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Pudeur et respect</h3><p style="margin: 0; color: #3E3832">Les séances sont réservées aux hommes. Du nombril aux genoux, le corps reste toujours couvert ; cuisses et ischios se travaillent par-dessus la serviette. La location de matériel et les cartes cadeaux sont ouvertes à tous et à toutes.</p></div>
<div style="margin-bottom: 18px"><h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Vos données</h3><p style="margin: 0; color: #3E3832">Vos informations servent uniquement à organiser votre rendez-vous. Elles ne sont ni vendues ni partagées. Voir la rubrique Confidentialité.</p></div>
</section>
